[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "remenis-memory"
version = "0.1.0"
authors = [
  { name="Remenis Team" },
]
description = "Lightweight AI memory middleware with SQLite vector search and fact extraction"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "sqlite-vec",
]

[project.urls]
"Homepage" = "https://github.com/remenis-memory/remenis"

